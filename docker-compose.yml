version: "3"
services:
  website:
    build:
      context: .
    ports:  # if you want to test that the website itself is working, uncomment this and access at port 5000
      - "5000:5000"  # for flask
      - "8000:8000"  # for Gunicorn
  nginx:
    image: nginx:alpine
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf  # :ro
      - ./nginx/.ssl:/etc/nginx/.ssl:ro
    depends_on:
      - website
    ports:
      - "8080:80"
      - "8443:443"

